<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        .product { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🛒 Наш Маркет</h2>
    
    <div class="product">
        <h3>🧸 Мишка</h3>
        <p>Цена: 50 ⭐</p>
        <button onclick="buy('mishka')">Купить</button>
    </div>

    <div class="product">
        <h3>⭐ Звезда</h3>
        <p>Цена: 25 ⭐</p>
        <button onclick="buy('zvezda')">Купить</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        function buy(productName) {
            // Отправляем данные боту (сработает, только если приложение открыто из кнопки в боте)
            tg.sendData(JSON.stringify({ action: "buy", product: productName }));
            
            // Показываем пользователю, что заказ принят
            tg.showAlert("Заказ на " + productName + " принят!");
            
            // Закрываем приложение через 1 секунду
            setTimeout(() => { tg.close(); }, 1000);
        }
    </script>
</body>
</html>
